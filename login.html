<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>로그인 · 행복톡톡</title><link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/account.css"><script src="/account.js" defer></script></head><body class="account-body" data-page="login"><header class="site-header account-header"><div class="nav-inner"><a class="brand" href="/">행복톡톡</a><nav class="account-nav" id="accountNav" aria-label="내 계정"><a href="/">홈으로</a></nav></div></header><main class="account-main"><section class="account-card"><p class="eyebrow">다시 만나 반가워요</p><h1>내 민원생활의 시작,<br>행복톡톡 로그인</h1><p class="account-description">접수한 민원과 상담 예약을<br>한곳에서 편하게 확인하세요.</p><div id="accountMessage" class="account-message" role="status" aria-live="polite"></div><form id="loginForm"><div class="form-field"><label for="email">이메일</label><input class="text-input" id="email" type="email" required autocomplete="username" maxlength="254" placeholder="이메일을 입력해 주세요"></div><div class="form-field"><label for="password">비밀번호</label><input class="text-input" id="password" type="password" required autocomplete="current-password" maxlength="128" placeholder="비밀번호를 입력해 주세요"></div><button class="btn-primary full" type="submit">로그인</button></form><button class="btn-secondary full" id="recoverPasswordButton" type="button">비밀번호를 잊으셨나요?</button><form id="recoveryForm" hidden><h2>새 비밀번호 설정</h2><p class="account-description">10~128자로 새 비밀번호를 입력해 주세요.</p><div class="form-field"><label for="newPassword">새 비밀번호</label><input class="text-input" id="newPassword" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></div><div class="form-field"><label for="newPasswordConfirm">새 비밀번호 확인</label><input class="text-input" id="newPasswordConfirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password"></div><button type="submit" class="btn-primary full">비밀번호 변경</button><button type="button" id="recoveryBackButton" class="btn-secondary full">로그인 화면으로</button></form><section id="resendArea" class="resend-area" ><p id="resendHelp">인증 메일을 못 받았거나 링크가 만료됐나요?<br>위 이메일을 확인하고 새 메일을 요청해 주세요. 이미 인증했다면 바로 로그인할 수 있어요.</p><button class="btn-secondary" id="resendEmailButton" type="button" aria-describedby="resendHelp">인증 메일 다시 받기</button></section><div class="account-links"><span>아직 회원이 아니신가요?</span><a href="/signup.html" id="signupLink">회원가입</a></div></section></main><footer class="site-footer"><div class="container"><p class="admin-mini">연성대학교 캡스톤 시연 서비스 · 실제 행정기관에 민원이 접수되지 않습니다. <a href="/privacy.html">개인정보 안내</a></p></div></footer></body></html>
