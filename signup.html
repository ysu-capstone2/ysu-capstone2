<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>회원가입 · 행복톡톡</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/account.css"><script src="/account.js" defer></script></head><body class="account-body" data-page="signup"><header class="site-header account-header"><div class="nav-inner"><a class="brand" href="/">행복톡톡</a><nav class="account-nav" id="accountNav" aria-label="내 계정"><a href="/">홈으로</a></nav></div></header><main class="account-main"><section class="account-card"><p class="eyebrow">처음 오셨나요?</p><h1>더 편한 민원생활,<br>함께 시작해요.</h1><p class="account-description">이메일로 가입하고 내 접수 내역을 확인하세요.</p><form id="signupForm"><div class="form-field"><label for="name">이름</label><input class="text-input" id="name" required maxlength="50" autocomplete="name" placeholder="이름을 입력해 주세요"></div><div class="form-field"><label for="email">이메일</label><input class="text-input" id="email" type="email" required maxlength="254" autocomplete="username" placeholder="인증 메일을 받을 이메일"></div><div class="form-field"><label for="password">비밀번호</label><input class="text-input" id="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="10자 이상 입력해 주세요"></div><div class="form-field"><label for="passwordConfirm">비밀번호 확인</label><input class="text-input" id="passwordConfirm" type="password" required minlength="10" maxlength="128" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해 주세요"></div><div id="accountMessage" class="account-message" role="status" aria-live="polite"></div><p class="data-notice">이름·이메일·인증 정보를 회원 식별과 로그인에 사용합니다. 현재 자동 삭제 기한은 미설정이며, 확인·삭제를 요청할 수 있습니다. <a href="/privacy.html">개인정보 안내</a></p><button class="btn-primary full" type="submit">회원가입</button></form><section id="resendArea" class="resend-area" hidden><p id="resendHelp">인증 메일을 못 받았거나 링크가 만료됐나요?<br>위 이메일을 확인하고 새 메일을 요청해 주세요. 이미 인증했다면 바로 로그인할 수 있어요.</p><button class="btn-secondary" id="resendEmailButton" type="button" aria-describedby="resendHelp">인증 메일 다시 받기</button></section><div class="account-links"><span>이미 가입하셨나요?</span><a href="/login.html" id="loginLink">로그인</a></div></section></main><footer class="site-footer"><div class="container"><p class="admin-mini">연성대학교 캡스톤 시연 서비스 · 실제 행정기관에 민원이 접수되지 않습니다. <a href="/privacy.html">개인정보 안내</a></p></div></footer></body></html>
